server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to backend Fly app
    location /api/ {
        proxy_pass https://ticket-tycoon-be.fly.dev;

        proxy_http_version 1.1;

        proxy_set_header Host ticket-tycoon-be.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important because your AI operations can take longer
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;

        # Useful for your SSE streaming endpoint
        proxy_buffering off;
        proxy_cache off;
    }
}